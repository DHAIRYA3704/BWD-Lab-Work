<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 19 - Registration with Validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="../assets/images/logo.png" alt="Electrofly" class="logo">
    <h1>Student Registration</h1>

    <form id="regForm" novalidate>
      <label for="name">Full Name</label>
      <input type="text" id="name">
      <small class="error" id="nameError"></small>

      <label for="email">Email</label>
      <input type="email" id="email">
      <small class="error" id="emailError"></small>

      <label for="password">Password</label>
      <input type="password" id="password">
      <small class="error" id="passwordError"></small>

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm">
      <small class="error" id="confirmError"></small>

      <label>Gender</label>
      <div class="radio-group">
        <label class="inline"><input type="radio" name="gender" value="Male"> Male</label>
        <label class="inline"><input type="radio" name="gender" value="Female"> Female</label>
        <label class="inline"><input type="radio" name="gender" value="Other"> Other</label>
      </div>
      <small class="error" id="genderError"></small>

      <label for="phone">Mobile Number</label>
      <input type="tel" id="phone">
      <small class="error" id="phoneError"></small>

      <label for="course">Course</label>
      <select id="course">
        <option value="">-- Select --</option>
        <option>Robotics with Arduino</option>
        <option>Coding &amp; AI</option>
        <option>Drone Building</option>
      </select>
      <small class="error" id="courseError"></small>

      <label class="inline terms"><input type="checkbox" id="terms"> I agree to the terms</label>
      <small class="error" id="termsError"></small>

      <button type="submit">Register</button>
    </form>
    <p id="success"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
