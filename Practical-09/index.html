<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 9 - Canvas and SVG</title>
</head>
<body>
  <h1>HTML5 Canvas &amp; SVG</h1>

  <h2>1. Basic Shapes using Canvas</h2>
  <canvas id="myCanvas" width="500" height="250" style="border: 1px solid #051A37;">
    Your browser does not support canvas.
  </canvas>

  <h2>2. Electrofly Logo Icon using SVG</h2>
  <svg width="260" height="260" viewBox="0 0 260 260">
    <!-- outer ring -->
    <circle cx="130" cy="130" r="120" fill="#051A37"/>
    <circle cx="130" cy="130" r="100" fill="none" stroke="#0DA9D1" stroke-width="6"/>
    <!-- letter E made of rectangles -->
    <rect x="80" y="70" width="20" height="120" fill="#FFFFFF"/>
    <rect x="80" y="70" width="80" height="20" fill="#FFFFFF"/>
    <rect x="80" y="120" width="65" height="20" fill="#0DA9D1"/>
    <rect x="80" y="170" width="80" height="20" fill="#FFFFFF"/>
    <!-- circuit trace -->
    <line x1="160" y1="80" x2="195" y2="80" stroke="#0DA9D1" stroke-width="5"/>
    <circle cx="200" cy="80" r="7" fill="#0DA9D1"/>
    <line x1="160" y1="180" x2="195" y2="180" stroke="#0DA9D1" stroke-width="5"/>
    <circle cx="200" cy="180" r="7" fill="#0DA9D1"/>
    <text x="130" y="230" fill="#FFFFFF" font-size="16" font-family="Arial" text-anchor="middle">ELECTROFLY</text>
  </svg>

  <script>
    let canvas = document.getElementById("myCanvas");
    let ctx = canvas.getContext("2d");

    // Rectangle
    ctx.fillStyle = "#0DA9D1";
    ctx.fillRect(30, 40, 120, 80);

    // Circle
    ctx.beginPath();
    ctx.arc(250, 80, 45, 0, 2 * Math.PI);
    ctx.fillStyle = "#051A37";
    ctx.fill();

    // Line
    ctx.beginPath();
    ctx.moveTo(350, 40);
    ctx.lineTo(470, 120);
    ctx.strokeStyle = "red";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Text
    ctx.font = "24px Arial";
    ctx.fillStyle = "#051A37";
    ctx.fillText("Rectangle, Circle, Line & Text", 60, 200);
  </script>
</body>
</html>
