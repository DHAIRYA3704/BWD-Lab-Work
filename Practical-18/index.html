<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical 18 - Subject Information</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #F3F8FC; color: #051A37; }
    header { background: #051A37; color: #fff; padding: 20px; text-align: center; }
    .layout { display: flex; gap: 25px; max-width: 900px; margin: 30px auto; padding: 0 20px; }
    #subjectList { list-style: none; padding: 0; width: 280px; }
    #subjectList li { background: #fff; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px;
                      border-left: 5px solid #DCE6F0; cursor: pointer; transition: .2s; }
    #subjectList li:hover { border-left-color: #0DA9D1; }
    #subjectList li.active { background: #0DA9D1; color: #fff; border-left-color: #051A37; }
    #details { flex: 1; background: #fff; padding: 25px; border-radius: 12px; min-height: 220px; }
    .meta { color: #0A8FB2; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Semester 1 Subjects</h1>
    <p>Click a subject to see its details</p>
  </header>

  <div class="layout">
    <ul id="subjectList"></ul>
    <div id="details">
      <h2>Select a subject</h2>
      <p>Subject information will appear here.</p>
    </div>
  </div>

  <script>
    // Array of subject objects
    let subjects = [
      { name: "Computer Fundamentals", type: "Theory", credits: 4,
        info: "Basics of computer hardware, software, number systems and operating systems." },
      { name: "Programming in C", type: "Theory + Lab", credits: 4,
        info: "Problem solving with C: variables, loops, arrays, functions and pointers." },
      { name: "Basic of Web Development", type: "Theory + Lab", credits: 4,
        info: "HTML5, CSS3, Bootstrap, JavaScript and publishing websites." },
      { name: "Mathematics for Computing", type: "Theory", credits: 3,
        info: "Sets, logic, matrices and statistics used in computer science." },
      { name: "Communication Skills", type: "Theory", credits: 2,
        info: "Professional reading, writing and presentation skills." }
    ];

    // Builds the list using a loop
    function showSubjectList() {
      let list = document.getElementById("subjectList");
      for (let i = 0; i < subjects.length; i++) {
        let item = document.createElement("li");
        item.textContent = (i + 1) + ". " + subjects[i].name;
        item.addEventListener("click", function () {
          showDetails(i, item);
        });
        list.appendChild(item);
      }
    }

    // Shows details of the selected subject
    function showDetails(index, item) {
      let s = subjects[index];
      let all = document.querySelectorAll("#subjectList li");
      all.forEach(function (li) { li.classList.remove("active"); });
      item.classList.add("active");

      document.getElementById("details").innerHTML =
        "<h2>" + s.name + "</h2>" +
        "<p class='meta'>Type: " + s.type + " | Credits: " + s.credits + "</p>" +
        "<p>" + s.info + "</p>" +
        "<p><small>Subject " + (index + 1) + " of " + subjects.length + "</small></p>";
    }

    // Runs when the page has loaded
    window.onload = showSubjectList;
  </script>
</body>
</html>
