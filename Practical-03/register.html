<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFest 2026 - Registration</title>
</head>
<body>
  <h1>TechFest 2026 &ndash; Team Registration</h1>
  <p>Fill in your team details to register for Electrofly TechFest 2026.</p>

  <form action="#" method="post">
    <p>
      <label for="team">Team Name:</label><br>
      <input type="text" id="team" name="team" required>
    </p>
    <p>
      <label for="leader">Team Leader:</label><br>
      <input type="text" id="leader" name="leader" required>
    </p>
    <p>
      <label for="phone">Phone:</label><br>
      <input type="tel" id="phone" name="phone" required>
    </p>
    <p>
      <label for="event">Competition:</label><br>
      <select id="event" name="event">
        <option>Robo Race</option>
        <option>Line Follower Challenge</option>
        <option>Coding Contest</option>
        <option>Tech Quiz</option>
      </select>
    </p>
    <p><input type="submit" value="Register Team"></p>
  </form>

  <p><a href="index.html">&larr; Back to event page</a></p>
</body>
</html>
